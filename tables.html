<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Tables Practice</title>
</head>
<body>
    <h1>Learning HTML Tables</h1>
    <table>
        <thead>
            <tr>
                <th colspan="2">AWS CLOUD SERVICE</th>
            </tr>
            <tr>
                <th>AWS Services</th>
                <th>Purpose</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Amazon S3</td>
                <td>Storage</td>
            </tr>
            <tr>
                <td>Amazon EC2</td>
                <td>Virtual Servers</td>
            </tr>
        </tbody>
    </table>     
    <h2>AWS Service Categories</h2>
    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>AWS Service</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Compute</td>
                <td>Amazon EC2</td>
            </tr>
            <tr>
                <td>AWS Lambda</td>
            </tr>
            <tr>
                <td>Storage</td>
                <td>Amazon S3</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
